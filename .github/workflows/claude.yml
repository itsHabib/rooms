name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

# Serialize the runs that can attest, and ONLY those. The attestation's
# evidence check looks for claude[bot] output postdating this job's start, so
# two overlapping review runs on one thread could credit one request with the
# other's completion comment.
#
# The group must exclude every run that cannot attest, because GitHub keeps a
# single pending run per group and cancels the older one — and this workflow
# feeds its own group: claude[bot]'s completion comment and the attestation
# from github-actions[bot] are both issue_comment events on the same thread.
# A blanket `claude-<n>` group lets those evict a queued review that then
# never runs, silently, on exactly the path the group exists to protect.
# Anything that cannot attest therefore gets a run-unique group.
concurrency:
  group: >-
    ${{
      (github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && contains(github.event.comment.body, '@claude'))
      && format('claude-{0}', github.event.issue.number)
      || format('claude-run-{0}', github.run_id)
    }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # write, not read: the attestation step below posts a comment with the
      # repository's own Actions token. Claude's own review comments come from
      # the claude[bot] app and never needed this.
      pull-requests: write
      # `gh pr comment` hits the issues-comments endpoint, which GitHub gates on
      # Issues-write for issues and Pull-requests-write for PRs. Rather than bet
      # the whole mechanism on that reading, match the two repos where this
      # attestation demonstrably lands — workbench and roxiq both grant it.
      issues: write
      id-token: write
      actions: read
    steps:
      # The action diffs via `git hash-object <path>`, so files a PR adds must
      # exist in the working tree — a main checkout has none of them, at any
      # fetch depth. Check out the PR head instead, but ONLY when the head
      # lives in this repo: in-repo branches require push access, so their
      # content is as trusted as the commenter the job already gates on. A
      # fork head never replaces the trusted workspace — fork PRs keep the
      # default-branch checkout.
      #
      # This also gives the attestation step below a truthful anchor: the tree
      # the reviewer actually ran against, resolved once, before it runs.
      - name: Resolve review ref (PR head for same-repo PRs)
        id: review_ref
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_NUMBER: >-
            ${{
              (github.event_name == 'issue_comment' && github.event.issue.pull_request
                && github.event.issue.number)
              || ((github.event_name == 'pull_request_review'
                  || github.event_name == 'pull_request_review_comment')
                && github.event.pull_request.number)
              || ''
            }}
        run: |
          set -euo pipefail
          # The fallback is the trusted default branch, never GITHUB_REF: on
          # fork pull_request_review* events GITHUB_REF is refs/pull/<n>/merge
          # — the fork's untrusted merge tree — and it must not survive into
          # the checkout just because the head lives elsewhere.
          ref="refs/heads/${DEFAULT_BRANCH}"
          if [ -n "${PR_NUMBER}" ]; then
            # A transient lookup failure degrades to the trusted ref instead
            # of killing the job — Claude still runs, it just reviews from
            # the default-branch workspace and never attests.
            same_repo=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
              --jq '.head.repo.full_name == .base.repo.full_name' || echo "false")
            if [ "${same_repo}" = "true" ]; then
              ref="refs/pull/${PR_NUMBER}/head"
            fi
          fi
          echo "resolved review ref: ${ref}"
          echo "ref=${ref}" >> "${GITHUB_OUTPUT}"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.review_ref.outputs.ref }}
          # Full history: the action's tag-mode diff (git hash-object) needs
          # PR-branch blobs that a depth-1 checkout lacks, so a shallow fetch
          # kills @claude review on any PR that adds files.
          fetch-depth: 0

      # Anchors the attestation's evidence window. A queued request keeps its
      # original comment timestamp, so "postdates the request" would accept a
      # PREVIOUS serialized run's output; "postdates this job's own start"
      # cannot — under the per-thread concurrency group, nothing else claude
      # runs on this thread between here and the attestation — the group covers
      # exactly the attesting runs. It is load-bearing, not hygiene: without it
      # two overlapping runs race and the one whose own review stubbed can
      # attest on the other's comment.
      - name: Open the evidence window
        id: attest_window
        run: echo "started=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "${GITHUB_OUTPUT}"

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Pin an explicit model id. The action installs the latest Claude Code
          # each run and otherwise uses the CLI's default model; that default
          # drifted to an id the OAuth-subscription token can't reach, so the SDK
          # errored on turn 1 and the reviewer posted only a stub. Pin the id
          # (not the `sonnet` alias, which can re-resolve to the broken default).
          claude_args: "--model claude-sonnet-4-6"
          additional_permissions: |
            actions: read

      # Gate counts a reviewer only against evidence bound to the exact judged
      # head: classifyPanel in gate's cmd/gate/internal/evidence/panel.go wants a
      # formal GitHub review with User.Type=Bot, a COMMENTED/APPROVED/
      # CHANGES_REQUESTED state, and commit_id == head. claude[bot] publishes its
      # review as an issue comment, which carries no commit anchor and satisfies
      # none of that, so every rooms PR parked on
      # `review panel incomplete: missing=[claude]` while a thorough review sat
      # right there in the thread. codex clears the panel only through a bespoke
      # comment-regex exemption; claude has no such carve-out.
      #
      # The `claude` check run on the PR is not the missing evidence and never
      # was. An @claude review runs on `issue_comment`, whose run is bound to the
      # default branch, so its check never appears on the PR at all; the `claude
      # skipping` line in `gh pr checks` is a *different* run — the one a bot's
      # own review submission triggers, correctly skipped because that review
      # body holds no `@claude`. No `if:` change can turn that into review
      # evidence.
      #
      # This step is the authority instead. The checkout above resolved a
      # specific ref and the reviewer ran against exactly that tree, so the
      # workflow can state the reviewed head as fact, in the fixed shape gate
      # parses (workflowAttestation in that same file) — the same structural
      # role the Codex connector's "Reviewed commit:" line plays. Asking the
      # model to publish a formal review instead cannot work here: gate refuses
      # provider prose as authority on principle, and a `gh pr review` posted
      # with the Actions token would carry the github-actions[bot] identity
      # rather than claude's.
      #
      # Attest only for a review request that succeeded: `@claude fix the typo`
      # runs this same job and must never clear a review panel.
      - name: Attest the reviewed head for gate's review panel
        if: >-
          steps.claude.outcome == 'success'
          && github.event_name == 'issue_comment'
          && github.event.issue.pull_request
          && contains(github.event.comment.body, '@claude')
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REVIEW_REF: ${{ steps.review_ref.outputs.ref }}
          # This job's own start time, not the request's timestamp: a queued
          # request predates the previous serialized run's output, so anchoring
          # on it would let this job attest on that run's evidence.
          WINDOW_STARTED_AT: ${{ steps.attest_window.outputs.started }}
          # Read as data, never interpolated into the script: the body is
          # attacker-controlled on a public repo.
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          # The trigger must be a review *request*, not any comment containing
          # the word. `@claude how do I review permissions?` and `@claude the
          # code-review tool is broken` both run this job and must not attest,
          # so match the request verb anchored at the start of the comment —
          # something an Actions `contains()` cannot express.
          #
          # This is precision over recall on purpose. `@claude could you review`
          # and `Hey @claude review this` are real review requests that do not
          # match, and they are supposed to not match: a missed attestation
          # leaves the panel incomplete and gate parks for judgment, which is
          # merely today's behaviour, while a false one credits a review that
          # never happened. The request must END at the verb (modulo a few
          # no-op tails), because `@claude review permissions` and `@claude
          # review the failing CI logs` start the same way and are not PR code
          # reviews. The WHOLE body is validated as one string — bash =~, not
          # grep, whose ^/$ anchor per line — so a `@claude review` first line
          # followed by countermanding instructions does not attest either.
          # Widen this pattern only toward forms that cannot also match such
          # a request.
          shopt -s nocasematch
          re='^[[:space:]]*@claude[[:space:]]+(please[[:space:]]+)?review([[:space:]]+(this([[:space:]]+pr)?|the[[:space:]]+pr))?[[:space:]]*[.!]?[[:space:]]*$'
          if [[ ! "${COMMENT_BODY}" =~ $re ]]; then
            echo "not a review request — no attestation"
            exit 0
          fi
          # A fork PR keeps the default-branch checkout by design, so HEAD is
          # not the reviewed head and there is nothing truthful to attest.
          if [ "${REVIEW_REF}" != "refs/pull/${PR_NUMBER}/head" ]; then
            echo "reviewed ${REVIEW_REF}, not the PR head — no attestation"
            exit 0
          fi
          # A push between checkout and now would make the attestation credit
          # a head Claude never saw. Attest only while the live PR head still
          # IS the checked-out commit; a moved head means gate parks, which is
          # the correct failure mode.
          head_sha="$(git rev-parse HEAD)"
          live_sha=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
            --jq '.head.sha' || echo "")
          if [ "${live_sha}" != "${head_sha}" ]; then
            echo "PR head moved to ${live_sha:-unknown} since checkout ${head_sha} — no attestation"
            exit 0
          fi
          # steps.claude.outcome == 'success' proves the action exited 0, not
          # that a review exists: a quota error, a setup failure, or a "I
          # could not inspect the diff" reply all exit 0 — this repo has already
          # shipped a stub review from exactly that path. Require published
          # evidence from claude[bot], created inside this job's own evidence
          # window: either a formal review, or an issue comment whose task list
          # is fully checked ("working…" stubs and error replies have unchecked
          # boxes or none at all). Missing evidence skips the attestation —
          # precision over recall, same as the trigger match above.
          reviews=$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews" \
            | jq -s --arg since "${WINDOW_STARTED_AT}" \
              '[.[][] | select(.user.login == "claude[bot]" and .submitted_at > $since)] | length' \
            || echo 0)
          finished=$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            | jq -s --arg since "${WINDOW_STARTED_AT}" \
              '[.[][] | select(.user.login == "claude[bot]" and .created_at > $since)
                | select((.body | contains("- [x]")) and ((.body | contains("- [ ]")) | not))] | length' \
            || echo 0)
          if [ "${reviews}" = "0" ] && [ "${finished}" = "0" ]; then
            echo "no completed claude review published for this request — no attestation"
            exit 0
          fi
          echo "attesting claude review of ${head_sha}"
          printf '%s\n**Reviewer:** claude\n**Reviewed commit:** `%s`\n' \
            '<!-- gate:review-attestation -->' "${head_sha}" \
            | gh pr comment "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --body-file -
